services:
  postgres:
    image: postgres:15-alpine
    container_name: veda-voice-db
    environment:
      POSTGRES_DB: vedavoice
      POSTGRES_USER: ${DATABASE_USER:-vedavoice}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vedavoice_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-vedavoice} -d vedavoice"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veda-voice-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vedavoice
      DATABASE_USER: ${DATABASE_USER:-vedavoice}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-vedavoice_pass}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: veda-voice-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://vedavoice:${DATABASE_PASSWORD:-vedavoice_pass}@postgres:5432/vedavoice
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veda-voice-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
      - ai-service

volumes:
  postgres_data:
