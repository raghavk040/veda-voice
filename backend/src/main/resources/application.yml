spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vedavoice}
    username: ${SPRING_DATASOURCE_USERNAME:vedauser}
    password: ${SPRING_DATASOURCE_PASSWORD:vedapassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.vedavoice: DEBUG
