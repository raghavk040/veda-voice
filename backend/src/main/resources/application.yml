spring:
  application:
    name: veda-voice-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vedavoice}
    username: ${DATABASE_USER:vedavoice}
    password: ${DATABASE_PASSWORD:vedavoice_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:veda-voice-secret-key-change-in-production-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.vedavoice: DEBUG
    org.springframework.security: INFO
